<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>حجز سيشن زفاف | استوديو التصوير</title>
<meta name="description" content="احجز سيشن تصوير الفرح خطوة بخطوة، اختر الباكدج المناسبة لك، وأرسل حجزك مباشرة عبر واتساب.">

<!-- PWA: يعمل الموقع بالكامل بدون إنترنت بعد أول زيارة -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#17151b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AM Photography">
<link rel="icon" href="./img/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./img/apple-touch-icon.png">

<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="page">


  <header class="site-header">
    <img src="./img/logo-gold.png" alt="AHMED MAHMOUD PHOTOGRAPHY" class="brand-logo" width="240" height="178" loading="eager">
    <p class="brand-tagline">حجز سيشن تصوير الأفراح</p>

    <nav class="social-row" aria-label="روابط التواصل الاجتماعي">
      <a class="social-btn social-btn-whatsapp" href="https://wa.me/201111714320?text=%D9%85%D8%B1%D8%AD%D8%A8%D9%8B%D8%A7%D8%8C%20%D8%A3%D8%B1%D8%B1%D8%AA%20%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D8%B9%D9%86%20%D8%AC%D9%84%D8%B3%D8%A7%D8%AA%20%D8%A7%D9%84%D8%AA%D8%B5%D9%88%D9%8A%D8%B1" target="_blank" rel="noopener noreferrer" aria-label="تواصل عبر واتساب">
        <img src="./img/icon-whatsapp.png" alt="" loading="lazy">
      </a>

      <a class="social-btn social-btn-facebook" href="https://www.facebook.com/ahmd.mhmwd.726577" target="_blank" rel="noopener noreferrer" aria-label="حساب فيسبوك">
        <img src="./img/icon-facebook.png" alt="" loading="lazy">
      </a>

      <a class="social-btn social-btn-tiktok" href="https://www.tiktok.com/@ahmed.m.p2" target="_blank" rel="noopener noreferrer" aria-label="حساب تيك توك">
        <img src="./img/icon-tiktok.png" alt="" loading="lazy">
      </a>

      <button type="button" class="social-btn social-btn-install" id="installAppBtn" aria-label="تثبيت التطبيق على أندرويد" title="تثبيت التطبيق" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24a11.463 11.463 0 0 0-8.94 0L5.65 5.67a.637.637 0 0 0-.87-.2c-.28.18-.37.54-.22.85L6.4 9.48A10.78 10.78 0 0 0 1 18h22a10.785 10.785 0 0 0-5.4-8.52zM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/></svg>
      </button>
    </nav>
  </header>

  <nav class="progress-bar" aria-label="مراحل الحجز">
    <ol class="progress-steps" id="progressSteps">
      <li class="progress-step is-active" data-step="1">
        <span class="progress-dot" aria-hidden="true">١</span>
        <span class="progress-label">بيانات الحجز</span>
      </li>
      <li class="progress-step" data-step="2">
        <span class="progress-dot" aria-hidden="true">٢</span>
        <span class="progress-label">اختيار الباكدج</span>
      </li>
      <li class="progress-step" data-step="3">
        <span class="progress-dot" aria-hidden="true">٣</span>
        <span class="progress-label">التأكيد</span>
      </li>
    </ol>
  </nav>

  <main class="app-main">

    <!-- ================= STEP 1 ================= -->
    <section class="step" id="step1" data-step-panel="1" aria-labelledby="step1-title">

      <form id="bookingForm" novalidate>

        <div class="field-group">
          <h2 id="step1-title" class="section-title">بيانات العريس</h2>

          <div class="field">
            <label for="groomName">اسم العريس ثلاثي</label>
            <input type="text" id="groomName" name="groomName" placeholder="أدخل اسم العريس بالكامل" autocomplete="name" aria-describedby="groomName-error">
            <p class="field-error" id="groomName-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="phone">رقم الهاتف للاتصال</label>
            <input type="tel" id="phone" name="phone" placeholder="01XXXXXXXXX" inputmode="numeric" maxlength="11" autocomplete="tel" aria-describedby="phone-error">
            <p class="field-error" id="phone-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="whatsapp">رقم الواتساب</label>
            <input type="tel" id="whatsapp" name="whatsapp" placeholder="01XXXXXXXXX" inputmode="numeric" maxlength="11" autocomplete="tel" aria-describedby="whatsapp-error">
            <p class="field-error" id="whatsapp-error" role="alert"></p>
          </div>

          <div class="field field-checkbox">
            <input type="checkbox" id="sameWhatsapp" name="sameWhatsapp" checked>
            <label for="sameWhatsapp">نفس رقم الاتصال هو رقم الواتساب</label>
          </div>
        </div>

        <div class="field-group">
          <h2 class="section-title">تفاصيل الحجز</h2>

          <div class="field">
            <label for="bookingDate">تاريخ الحجز</label>
            <input type="date" id="bookingDate" name="bookingDate" aria-describedby="bookingDate-error">
            <p class="field-error" id="bookingDate-error" role="alert"></p>
          </div>
        </div>

        <div class="field-group">
          <h2 class="section-title">مكان الفرح</h2>

          <div class="field">
            <label for="governorate">المحافظة</label>
            <select id="governorate" name="governorate" aria-describedby="governorate-error">
              <option value="" selected disabled>اختر المحافظة</option>
            </select>
            <p class="field-error" id="governorate-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="city">المدينة</label>
            <select id="city" name="city" disabled aria-describedby="city-error">
              <option value="" selected disabled>اختر المدينة</option>
            </select>
            <p class="field-error" id="city-error" role="alert"></p>
          </div>

          <p class="locations-status" id="locationsStatus" role="status"></p>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="requestSessionBtn">
          طلب سيشن
        </button>

      </form>
    </section>

    <!-- ================= STEP 2 ================= -->
    <section class="step" id="step2" data-step-panel="2" hidden aria-labelledby="step2-title">
      <h2 id="step2-title" class="section-title section-title-lg">باكدجات الزفاف</h2>
      <p class="section-hint">اختر باكدج واحدة تناسب يوم فرحك</p>

      <p class="packages-status" id="packagesStatus" role="status"></p>

      <div class="accordion" id="packagesAccordion"></div>

      <div class="step2-actions">
        <button type="button" class="btn btn-ghost" id="backToStep1">رجوع لبيانات الحجز</button>
      </div>
    </section>

    <!-- ================= STEP 3 ================= -->
    <section class="step" id="step3" data-step-panel="3" hidden aria-labelledby="step3-title">
      <h2 id="step3-title" class="section-title section-title-lg">تأكيد الحجز</h2>
      <p class="section-hint">راجع بيانات حجزك ثم أرسله عبر واتساب</p>

      <div class="summary-card" id="summaryCard"></div>

      <div class="step3-actions">
        <button type="button" class="btn btn-ghost" id="backToStep2">تعديل الباكدج</button>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <p>ALL RIGHT RESERVED 2026 - @XERNEL0x58</p>
  </footer>

  <!-- Sticky WhatsApp confirmation bar (visible on step 2 once a package is selected) -->
  <div class="sticky-cta" id="stickyCta" hidden>
    <div class="sticky-cta-inner">
      <div class="sticky-cta-info">
        <span class="sticky-cta-label" id="stickyCtaLabel"></span>
        <span class="sticky-cta-price" id="stickyCtaPrice"></span>
      </div>
      <button type="button" class="btn btn-whatsapp" id="confirmWhatsappBtn" disabled>
        <svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true" fill="currentColor">
          <path d="M16.02 3C9.4 3 4 8.37 4 14.98c0 2.13.56 4.13 1.63 5.9L4 29l8.28-1.6a12.9 12.9 0 0 0 3.74.55h.01c6.62 0 12.02-5.37 12.02-11.98C28.05 8.37 22.65 3 16.02 3Zm0 21.9h-.01c-1.9 0-3.75-.5-5.37-1.44l-.38-.23-4.9.95.96-4.78-.25-.4a9.9 9.9 0 0 1-1.53-5.02C4.54 8.97 9.02 4.5 16.02 4.5c3.4 0 6.6 1.32 9 3.73a12.6 12.6 0 0 1 3.73 8.75c0 6.03-4.94 10.92-10.98 10.92h-.75Zm5.98-8.2c-.33-.16-1.93-.95-2.23-1.06-.3-.11-.51-.16-.73.16-.22.33-.84 1.06-1.03 1.27-.19.22-.38.24-.7.08-.33-.16-1.36-.5-2.6-1.6-.96-.86-1.6-1.92-1.79-2.24-.19-.33-.02-.5.14-.67.14-.14.33-.38.49-.57.16-.19.22-.33.33-.55.11-.22.05-.41-.03-.57-.08-.16-.73-1.76-1-2.41-.26-.63-.53-.55-.73-.56h-.62c-.22 0-.57.08-.87.4-.3.33-1.13 1.1-1.13 2.7 0 1.6 1.16 3.14 1.32 3.36.16.22 2.28 3.48 5.53 4.88.77.33 1.37.53 1.84.68.77.25 1.47.21 2.03.13.62-.09 1.93-.79 2.2-1.55.27-.76.27-1.42.19-1.55-.08-.14-.3-.22-.62-.38Z"/>
        </svg>
        تأكيد الحجز عبر واتساب
      </button>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="assertive" hidden></div>

</div>

<script src="./js/validation.js"></script>
<script src="./js/locations.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
